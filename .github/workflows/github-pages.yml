# Публикация статичной сборки Vite на GitHub Pages.
name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка для GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /Rebyata2/

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
